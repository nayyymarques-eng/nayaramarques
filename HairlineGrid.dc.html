<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ gridStyle }}">{{ children }}</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:200},&quot;min&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:170,&quot;min&quot;:120,&quot;max&quot;:360,&quot;step&quot;:10,&quot;tsType&quot;:&quot;number&quot;},&quot;flush&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const min = this.props.min ?? 170;
    return {
      children: this.props.children,
      gridStyle: {
        display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(' + min + 'px,1fr))',
        gap: 1, background: '#dedbd5', border: '1px solid #dedbd5', overflow: 'hidden',
        marginBottom: this.props.flush ? 0 : 24
      }
    };
  }
}
</script>
</body>
</html>
