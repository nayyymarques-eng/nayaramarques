<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ cardStyle }}">
  <div style="{{ eyebrowStyle }}">{{ eyebrow }}</div>
  <div style="{{ titleStyle }}">{{ title }}</div>
  <p style="margin:0;font-size:14px;line-height:1.6;color:#4a4e55">{{ children }}</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:180},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Simplicity&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;muted&quot;,&quot;warn&quot;],&quot;default&quot;:&quot;muted&quot;,&quot;tsType&quot;:&quot;'muted' | 'warn'&quot;},&quot;on&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;paper&quot;,&quot;grey&quot;],&quot;default&quot;:&quot;paper&quot;,&quot;tsType&quot;:&quot;'paper' | 'grey'&quot;},&quot;bordered&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const eyebrow = this.props.eyebrow ?? '';
    const bordered = !!this.props.bordered;
    return {
      eyebrow: eyebrow,
      title: this.props.title ?? 'Simplicity',
      children: this.props.children,
      eyebrowStyle: {
        display: eyebrow ? 'block' : 'none', fontSize: 10, fontWeight: 600,
        letterSpacing: '0.14em', textTransform: 'uppercase',
        color: this.props.accent === 'warn' ? '#8a4a2a' : '#5f636a', marginBottom: 10
      },
      titleStyle: { fontSize: 14, fontWeight: 600, marginBottom: 8, color: '#101114' },
      cardStyle: {
        background: this.props.on === 'grey' ? '#f2f1ee' : '#fff',
        border: bordered ? '1px solid #dedbd5' : 'none',
        padding: bordered ? 20 : '20px 18px', height: '100%'
      }
    };
  }
}
</script>
</body>
</html>
