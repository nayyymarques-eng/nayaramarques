<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ rowStyle }}">
  <span style="font-size:11px;color:#4a5526;flex-shrink:0;padding-top:3px">{{ marker }}</span>
  <p style="margin:0;font-size:16px;line-height:1.7;color:#2a2d33;text-wrap:pretty"><strong style="{{ titleStyle }}">{{ title }}</strong>{{ children }}</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:120},&quot;marker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;A&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;A third-party insurer.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;last&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const title = this.props.title ?? '';
    return {
      marker: this.props.marker ?? 'A',
      title: title ? title + ' ' : '',
      titleStyle: { color: '#101114', fontWeight: 600, display: title ? 'inline' : 'none' },
      children: this.props.children,
      rowStyle: {
        display: 'flex', gap: 16, padding: '18px 0', maxWidth: '70ch',
        borderTop: '1px solid #dedbd5',
        borderBottom: this.props.last ? '1px solid #dedbd5' : 'none'
      }
    };
  }
}
</script>
</body>
</html>
