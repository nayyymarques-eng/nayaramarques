# The site's harness on GitHub (CLAUDE.md §0, step 3): harness/check.py runs the source rules, then every page in
# headless Chrome at 1400px and 375px, and once with reduced motion. It must end with PASS.
# Runs on every pull request and every push to main. It does not stop the Cloudflare deploy: a merge publishes,
# so read this check on the pull request before you merge.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request cancels the older run; on main every run finishes.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness:
    name: harness/check.py
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROME: google-chrome   # the runner's Chrome; on the Mac, check_pages_cli.mjs uses /Applications/Google Chrome.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Chrome on the runner
        run: google-chrome --version
      - name: python3 harness/check.py
        run: python3 harness/check.py
