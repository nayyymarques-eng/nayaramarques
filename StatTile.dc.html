<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ tileStyle }}">
  <div style="font-size:clamp(24px,3.4vw,44px);line-height:1.06;letter-spacing:-0.036em;margin-bottom:10px">{{ value }}</div>
  <p style="margin:0;font-size:14px;line-height:1.6;color:var(--ink-2)">{{ children }}</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:180},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;90%&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;on&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;paper&quot;,&quot;grey&quot;],&quot;default&quot;:&quot;paper&quot;,&quot;tsType&quot;:&quot;'paper' | 'grey'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      value: this.props.value ?? '90%',
      children: this.props.children,
      tileStyle: { background: this.props.on === 'grey' ? '#f2f1ee' : '#fff', padding: '22px 18px', height: '100%' }
    };
  }
}
</script>
</body>
</html>
