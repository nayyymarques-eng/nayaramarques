<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="{{ chipStyle }}">{{ label }}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:60},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;key&quot;,&quot;decision&quot;,&quot;note&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;'default' | 'key' | 'decision' | 'note'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? 'default';
    const base = {
      display: 'inline-block', padding: '10px 14px', fontSize: 14, lineHeight: 1.6, whiteSpace: 'nowrap',
      border: '1px solid #dedbd5', background: '#f2f1ee', color: '#2a2d33'
    };
    const variants = {
      decision: { background: '#101114', color: '#f2f1ee', border: '1px solid #101114' },
      key: { borderColor: '#101114', fontWeight: 600 },
      note: { border: 'none', background: 'transparent', color: '#4a4e55', padding: '10px 0' }
    };
    return { label: this.props.label ?? 'Home', chipStyle: Object.assign({}, base, variants[v] || {}) };
  }
}
</script>
</body>
</html>
