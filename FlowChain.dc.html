<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ wrapStyle }}">
  <div style="{{ labelStyle }}">{{ label }}</div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">{{ children }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:880,&quot;height&quot;:140},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Contracting&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;branch&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const label = this.props.label ?? '';
    const branch = !!this.props.branch;
    return {
      label: label,
      children: this.props.children,
      labelStyle: {
        display: label ? 'block' : 'none', fontSize: 10, fontWeight: 600, letterSpacing: '0.14em',
        textTransform: 'uppercase', color: '#5f636a', marginBottom: 12
      },
      wrapStyle: branch
        ? { marginTop: 16, marginLeft: 12, paddingLeft: 22, borderLeft: '2px solid #dedbd5' }
        : { padding: '30px 0 34px', borderTop: '1px solid #dedbd5' }
    };
  }
}
</script>
</body>
</html>
