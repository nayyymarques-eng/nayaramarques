<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;min-width:0">
  <p style="margin:0 0 14px;padding-right:72px;max-width:88ch;font-size:14px;line-height:1.6;color:#4a4e55"><span style="{{ countStyle }}">{{ count }}</span><strong style="{{ nameStyle }}">{{ name }}</strong>{{ children }}</p>
  <div style="{{ frameStyle }}">
    <image-slot id="{{ slotId }}" src="{{ src }}" shape="rect" fit="contain" style="display:block;width:100%;height:100%"></image-slot>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:420},&quot;name&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Hedvig&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1 / 7&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;slotId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;carousel-slot&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;frame&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#c3c3c3&quot;,&quot;#ffffff&quot;,&quot;#f2f1ee&quot;],&quot;default&quot;:&quot;#c3c3c3&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const name = this.props.name ?? '';
    const count = this.props.count ?? '';
    return {
      count: count,
      countStyle: { color: '#5f636a', marginRight: 10, display: count ? 'inline' : 'none' },
      name: name ? name + ' — ' : '',
      nameStyle: { color: '#101114', fontWeight: 600, display: name ? 'inline' : 'none' },
      children: this.props.children,
      slotId: this.props.slotId ?? 'carousel-slot',
      src: this.props.src ?? '',
      frameStyle: {
        background: this.props.frame ?? '#c3c3c3',
        border: '1px solid #b9b9b9',
        height: 'clamp(280px,32vw,420px)'
      }
    };
  }
}
</script>
</body>
</html>
