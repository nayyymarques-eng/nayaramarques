<!-- @dsCard height=330 -->
<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin: 0; background: var(--paper); font-family: var(--font-sans); }
  .cover { position: relative; width: 960px; height: 330px; }
  svg { position: absolute; left: 0; top: 0; }
  .ink { fill: var(--ink); } .band { fill: var(--paper-2); } .rust { fill: var(--rust); }
  .baby { fill: var(--baby); } .red { fill: var(--red); }
  .r-ink { stroke: var(--line-ink); } .r-mid { stroke: var(--line-mid); } .r-line { stroke: var(--line); }
  .tile { rx: var(--radius); }
  .text { position: absolute; left: 32px; top: 146px; max-width: 900px; }
  h1 { margin: 0; font-size: 64px; line-height: .95; font-weight: var(--weight-medium); letter-spacing: var(--track-display); color: var(--ink); }
  p { margin: 14px 0 0; font-size: 14px; line-height: 1.5; color: var(--ink-4); max-width: 440px; }
</style></head>
<body>
<div class="cover">
  <svg width="960" height="112" viewBox="0 0 960 112" aria-hidden="true">
    <!-- blocks: ink 448x112 (dark band), paper-2 288x112 (alternate band), rust 112x112, baby 88x24 on the ink only, red 16x16 (nav mark); corners radius (2px)
         arrangement: a strip of unequal bands bleeding off the top and right, the way the site stacks paper / paper-2 / ink bands
         pattern: editorial hairlines ("borders not shadows"): the three line weights, line-ink, line-mid, line, crossing the paper-2 band
         steps: space-14 (32px) gutter, 16px and 24px from the spacing scale; widths in multiples of 16 -->
    <rect class="band tile" x="0" y="0" width="288" height="112"></rect>
    <line class="r-ink" x1="0" y1="40.5" x2="288" y2="40.5" stroke-width="1"></line>
    <line class="r-mid" x1="0" y1="64.5" x2="288" y2="64.5" stroke-width="1"></line>
    <line class="r-line" x1="0" y1="88.5" x2="288" y2="88.5" stroke-width="1"></line>
    <rect class="ink tile" x="304" y="0" width="448" height="112"></rect>
    <rect class="baby tile" x="336" y="56" width="88" height="24"></rect>
    <rect class="red tile" x="720" y="16" width="16" height="16"></rect>
    <rect class="rust tile" x="768" y="0" width="192" height="112"></rect>
  </svg>
  <div class="text">
    <h1>Nayara Marques —<br>Design System</h1>
    <p>Paper, ink and one blue. Square corners, hairline rules, no shadows.</p>
  </div>
</div>
</body></html>
