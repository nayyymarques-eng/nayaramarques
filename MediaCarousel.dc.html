<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="min-width:0;position:relative;border-top:1px solid #dedbd5;padding-top:16px">
  <div style="position:absolute;top:14px;right:0;display:flex;gap:6px;z-index:2">
    <button type="button" aria-label="Previous" onClick="{{ prev }}" style="width:26px;height:26px;border:1px solid #dedbd5;background:#fff;color:#101114;font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0" style-hover="border-color:#101114;color:#4a5526">←</button>
    <button type="button" aria-label="Next" onClick="{{ next }}" style="width:26px;height:26px;border:1px solid #dedbd5;background:#fff;color:#101114;font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0" style-hover="border-color:#101114;color:#4a5526">→</button>
  </div>
  <div ref="{{ trackRef }}" data-carousel-track="1" style="display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none">{{ children }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:460}}">
class Component extends DCLogic {
  state = { i: 0 };
  el() {
    if (this._el && this._el.isConnected) return this._el;
    const all = document.querySelectorAll('[data-carousel-track]');
    for (const t of all) { if (t.contains(this._probe) || all.length === 1) { this._el = t; break; } }
    return this._el || all[0];
  }
  size = () => {
    const el = this.el();
    if (!el) return;
    for (const c of el.children) {
      c.style.flex = '0 0 100%';
      c.style.minWidth = '0';
      c.style.scrollSnapAlign = 'start';
    }
  };
  componentDidMount() {
    this.size();
    this._obs = new MutationObserver(this.size);
    const el = this.el();
    if (el) this._obs.observe(el, { childList: true });
    this._resize = () => this.size();
    window.addEventListener('resize', this._resize);
  }
  componentDidUpdate() { this.size(); }
  go(n) {
    const el = this.el();
    if (!el) return;
    const count = el.children.length || 1;
    const i = Math.max(0, Math.min(count - 1, n));
    const from = el.scrollLeft, to = i * el.clientWidth, t0 = Date.now(), dur = 380;
    clearInterval(this._tween);
    this._tween = setInterval(() => {
      const k = Math.min(1, (Date.now() - t0) / dur);
      el.scrollLeft = from + (to - from) * (1 - Math.pow(1 - k, 3));
      if (k >= 1) clearInterval(this._tween);
    }, 16);
    this.setState({ i: i });
  }
  componentWillUnmount() {
    clearInterval(this._tween);
    if (this._obs) this._obs.disconnect();
    if (this._resize) window.removeEventListener('resize', this._resize);
  }
  renderVals() {
    return {
      children: this.props.children,
      trackRef: (n) => { if (n) this._el = n; },
      prev: () => this.go(this.state.i - 1),
      next: () => this.go(this.state.i + 1)
    };
  }
}
</script>
</body>
</html>
