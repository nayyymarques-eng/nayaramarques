<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="border:1px solid var(--line);background:var(--white);padding:clamp(20px,2.6vw,28px)">
  <div style="font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-6);margin-bottom:12px">{{ eyebrow }}</div>
  <h3 style="font-weight:500;font-size:clamp(19px,2.2vw,26px);line-height:1.16;letter-spacing:-0.026em;margin:0 0 14px">{{ title }}</h3>
  <p style="margin:0 0 18px;font-size:16px;line-height:1.7;color:var(--ink);text-wrap:pretty">{{ children }}</p>
  <div style="border-top:1px solid var(--line-4);padding-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px">
    <div>
      <div style="font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--gained);margin-bottom:7px">Gained</div>
      <p style="margin:0;font-size:14px;line-height:1.6;color:var(--ink-2)">{{ gained }}</p>
    </div>
    <div>
      <div style="font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--traded);margin-bottom:7px">Traded away</div>
      <p style="margin:0;font-size:14px;line-height:1.6;color:var(--ink-2)">{{ traded }}</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:420},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Decision 01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Three plans, then one free assistance&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;gained&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;traded&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      eyebrow: this.props.eyebrow ?? 'Decision 01',
      title: this.props.title ?? 'Decision title',
      gained: this.props.gained ?? '',
      traded: this.props.traded ?? '',
      children: this.props.children
    };
  }
}
</script>
</body>
</html>
