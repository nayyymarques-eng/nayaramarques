<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ wrapStyle }}">
  <div style="border-top:1px solid #101114;padding-top:18px;font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#101114;margin-bottom:6px">{{ heading }}</div>
  <p style="{{ introStyle }}">{{ intro }}</p>
  {{ children }}
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:820,&quot;height&quot;:220},&quot;step&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Benchmark&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;intro&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;last&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const intro = this.props.intro ?? '';
    return {
      heading: (this.props.step ?? '01') + ' — ' + (this.props.title ?? 'Benchmark'),
      intro: intro,
      introStyle: {
        display: intro ? 'block' : 'none', margin: '0 0 18px', maxWidth: '88ch',
        fontSize: 14, lineHeight: 1.6, color: '#4a4e55'
      },
      children: this.props.children ?? null,
      wrapStyle: { marginBottom: this.props.last ? 0 : 'clamp(44px,6vw,72px)' }
    };
  }
}
</script>
</body>
</html>
