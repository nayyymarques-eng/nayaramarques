<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ bandStyle }}">
  <h2 style="flex:0 0 200px;font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#4a4e55;margin:0;position:sticky;top:80px">{{ label }}</h2>
  <div style="flex:1 1 460px;min-width:0">{{ children }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:420},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01 — Context&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;band&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;paper&quot;,&quot;grey&quot;],&quot;default&quot;:&quot;paper&quot;,&quot;tsType&quot;:&quot;'paper' | 'grey'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const band = this.props.band === 'grey' ? '#e9e7e2' : '#f2f1ee';
    return {
      label: this.props.label ?? '01 — Section',
      children: this.props.children,
      bandStyle: {
        display: 'flex', flexWrap: 'wrap', gap: 'clamp(20px,4vw,64px)', alignItems: 'flex-start',
        minWidth: 0, background: band, boxShadow: '0 0 0 100vmax ' + band,
        clipPath: 'inset(0 -100vmax)',
        paddingTop: 'clamp(40px,6vw,72px)', paddingBottom: 'clamp(40px,6vw,72px)'
      }
    };
  }
}
</script>
</body>
</html>
